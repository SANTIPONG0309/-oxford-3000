<title>Oxford 3000</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 600px;
    background: white;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    text-align: center;
}
h1 { margin: 0; font-size: 36px; }
.subtitle { color: #777; margin-top: 8px; }
.status {
    display: flex;
    justify-content: space-between;
    background: #f3f4f6;
    padding: 12px 18px;
    border-radius: 12px;
    margin: 25px 0;
}
.question-box { margin: 25px 0; }
.question-box p { color: #777; }
#word {
    font-size: 42px;
    margin: 15px 0;
    color: #222;
}
#choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.choice {
    width: 100%;
    padding: 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}
.choice:hover:not(:disabled) {
    transform: translateY(-2px);
    background: #f3f4f6;
    border-color: #667eea;
}
.choice:disabled { cursor: default; opacity: 0.8; }
#result {
    min-height: 30px;
    margin: 20px 0;
    font-size: 20px;
    font-weight: bold;
}
#nextButton {
    display: none;
    border: none;
    padding: 14px 30px;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 17px;
    cursor: pointer;
}
#nextButton:hover { background: #444; }
@media (max-width: 500px) {
    .container { padding: 25px 18px; }
    h1 { font-size: 28px; }
    #word { font-size: 34px; }
}
</style>
</head>

let currentWord, correctAnswer, score = 0, questionCount = 0;
const totalQuestions = 50;
let usedWords = [];

function nextQuestion() {
    if (questionCount >= totalQuestions) {
        showFinalScore();
        return;
    }

    document.getElementById("result").innerHTML = "";
    document.getElementById("nextButton").style.display = "none";

    let availableWords = words.filter(item => !usedWords.includes(item.word));
    if (availableWords.length === 0) {
        showFinalScore();
        return;
    }

    currentWord = availableWords[Math.floor(Math.random() * availableWords.length)];
    usedWords.push(currentWord.word);
    questionCount++;

    document.getElementById("questionNumber").innerHTML =
        `ข้อ ${questionCount} / ${totalQuestions}`;
    document.getElementById("word").innerHTML = currentWord.word;
    correctAnswer = currentWord.meaning;

    let wrongAnswers = words
        .filter(item => item.meaning !== correctAnswer)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3)
        .map(item => item.meaning);

    let choices = [correctAnswer, ...wrongAnswers];
    choices.sort(() => Math.random() - 0.5);

    let html = "";
    choices.forEach((choice, index) => {
        const encoded = encodeURIComponent(choice);
        html += `<button class="choice" onclick="checkAnswer(decodeURIComponent('${encoded}'))">
            ${String.fromCharCode(65 + index)}. ${choice}
        </button>`;
    });

    document.getElementById("choices").innerHTML = html;
}

function checkAnswer(answer) {
    document.querySelectorAll(".choice").forEach(button => button.disabled = true);

    let result = document.getElementById("result");

    if (answer === correctAnswer) {
        score++;
        document.getElementById("score").innerHTML = score;
        result.innerHTML = "✅ ถูกต้อง! +1 คะแนน";
        result.style.color = "green";
    } else {
        result.innerHTML = `❌ ผิด! คำตอบคือ "${correctAnswer}"`;
        result.style.color = "red";
    }

    document.getElementById("nextButton").style.display = "inline-block";
}

function showFinalScore() {
    document.getElementById("word").innerHTML = "🎉 จบการทดสอบ!";
    document.getElementById("choices").innerHTML = "";
    document.getElementById("result").innerHTML =
        `คุณได้ ${score} / ${questionCount} คะแนน`;
    document.getElementById("nextButton").innerHTML = "🔄 เริ่มใหม่";
    document.getElementById("nextButton").style.display = "inline-block";
    document.getElementById("nextButton").onclick = restartQuiz;
}

function restartQuiz() {
    score = 0;
    questionCount = 0;
    usedWords = [];

    document.getElementById("score").innerHTML = "0";
    document.getElementById("nextButton").innerHTML = "ข้อต่อไป →";
    document.getElementById("nextButton").onclick = nextQuestion;

    nextQuestion();
}

nextQuestion();
